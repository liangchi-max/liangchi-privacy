name: 部署隐私政策到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 开启 Pages（未开启时自动开启）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 打印站点地址
        run: echo "站点地址: ${{ steps.deployment.outputs.page_url }}"
